[project]
name = "todo-ai-api"
version = "1.0.0"
description = "Async FastAPI backend for Todo AI"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "redis>=6.2,<7.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "email-validator>=2.2,<3.0",
  "anthropic>=0.57,<1.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "aiosqlite>=0.21,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702", "F401", "UP042"]
